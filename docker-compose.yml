version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: budget_api
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    networks:
      - budget_network

  # Servicio opcional de MongoDB para desarrollo local si no se cuenta con un cluster externo
  mongodb:
    image: mongo:7-jammy
    container_name: budget_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=budget_db
    volumes:
      - mongo_data:/data/db
    networks:
      - budget_network
    profiles:
      - local-db

networks:
  budget_network:
    driver: bridge

volumes:
  mongo_data:
